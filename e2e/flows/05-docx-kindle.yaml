appId: com.fatihuzunoglu.seslikitap
name: Word (DOCX) ve Kindle (AZW3) kitapları
---
- launchApp:
    clearState: true
- tapOn:
    id: "empty-add"
- tapOn:
    id: "add-url"
- tapOn:
    id: "url-input"
- inputText: "${SERVER}/notlar.docx"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "%0 · 2 bölüm.*"
    timeout: 90000
- assertVisible: "Kütüphane Notları"
- tapOn:
    id: "add-button"
- tapOn:
    id: "add-url"
- tapOn:
    id: "url-input"
- inputText: "${SERVER}/alice-gutenberg.azw3"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Alice's Adventures in Wonderland"
    timeout: 90000
- extendedWaitUntil:
    visible:
      text: "%0 · 19 bölüm.*"
    timeout: 90000
- takeScreenshot: ${OUT}/16-docx-kindle-library
- tapOn: "Alice's Adventures in Wonderland"
- tapOn:
    id: "toc-button"
- tapOn: "CHAPTER I. Down the Rabbit-Hole"
- assertVisible: ".*Alice was beginning to get very tired.*"
- takeScreenshot: ${OUT}/17-kindle-chapter
